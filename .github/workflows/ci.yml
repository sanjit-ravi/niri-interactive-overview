name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compositor:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config clang libudev-dev libgbm-dev libxkbcommon-dev libegl1-mesa-dev libwayland-dev libinput-dev libdbus-1-dev libsystemd-dev libseat-dev libpipewire-0.3-dev libpango1.0-dev libgdk-pixbuf-2.0-dev libdisplay-info-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build compositor
        run: cargo build --release --locked
      - name: Validate standalone example
        run: ./target/release/niri validate --config resources/interactive-overview.kdl
      - name: Compile tests
        run: cargo test --release --locked --workspace --exclude niri-visual-tests --no-run
      - name: Focused protocol and geometry tests
        run: timeout --kill-after=5s 120s cargo test --release --locked overview -- --test-threads=1
      - name: Broader non-visual tests
        run: timeout --kill-after=5s 300s cargo test --release --locked --workspace --exclude niri-visual-tests -- --test-threads=1
      - name: Bounded randomized layout checks
        run: RUN_SLOW_TESTS=1 PROPTEST_CASES=1000 PROPTEST_RNG_SEED=42 timeout --kill-after=5s 180s cargo test --release --locked --lib layout::tests::random_operations_dont_panic -- --exact --test-threads=1
